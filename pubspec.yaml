name: shopee
description: "A new Flutter project."

publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: '>=3.4.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  smooth_page_indicator: ^1.0.0
  flutter_bloc: ^8.1.3
  http: ^1.3.0
  cupertino_icons: ^1.0.6
  uuid: ^4.5.1
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo/
    - assets/promotions/
    - assets/products/
    - assets/live/
    - assets/banner/
    - assets/category/
    - assets/popup/
    - assets/images/

  fonts:
    - family: Kanit
      fonts:
        - asset: assets/fonts/Kanit-Regular.ttf

